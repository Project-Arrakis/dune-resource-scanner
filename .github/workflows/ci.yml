name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.4"

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -cover ./...

      - name: shellcheck
        run: shellcheck -S warning tools/*.sh

      # This repository is public and its findings are written against a live
      # game server, so an operator identifier or an internal address is easy to
      # paste in unnoticed. Guard it in CI rather than by convention.
      - name: no PII or internal addresses in tracked files
        run: ./tools/check-public-safe.sh

      # docs/index.html is generated from findings/README.md. Regenerate and
      # compare, so the published page can never drift from its source.
      - name: findings page is up to date
        run: |
          python3 -m pip install --quiet 'markdown-it-py==4.2.0'
          python3 tools/build-findings-page.py --check

  security-scan:
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan.yml@main
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
